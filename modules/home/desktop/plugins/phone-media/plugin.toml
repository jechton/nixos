id = "jeremiah/phone-media"
name = "Phone Media"
version = "1.0.0"
plugin_api = 24
author = "jeremiah"
license = "MIT"

dependencies = ["playerctl"]

icon = "disc"

description = "Now-playing bar widget and popup replacing the builtin ones; scrolls phone volume over KDE Connect."

tags = ["bar", "media", "music", "kdeconnect"]

# Shared by every entry that shows synced lyrics (see lyrics.luau): the
# now-playing popup, the lyrics bar widget, and the lyrics popup, so nudging
# sync only has to happen in one place.
[[setting]]
key = "lyrics_offset_ms"
type = "int"
label_key = "settings.lyrics_offset_ms.label"
description_key = "settings.lyrics_offset_ms.description"
default = 0
min = -5000
max = 5000
step = 100

[[widget]]
id = "bar"
entry = "bar.luau"

# Left opens this plugin's own panel. right is handled in bar.luau (onRightClick)
# so it targets the exact player the widget picked. back/forward can't reach the
# script (the plugin's input area doesn't take those buttons), so they shell out
# to a picker that prefers a playing KDE Connect player, matching the widget,
# rather than noctalia's builtin `media` action which hits whatever player
# noctalia considers active. Scroll is volume, also handled in bar.luau.
[widget.actions]
left = "panel-toggle jeremiah/phone-media:panel"
back = "exec sh -c 'for p in $(playerctl --list-all 2>/dev/null); do case $p in kdeconnect*) [ \"$(playerctl -p $p status 2>/dev/null)\" = Playing ] && exec playerctl -p $p previous;; esac; done; playerctl --player=kdeconnect,%any previous'"
forward = "exec sh -c 'for p in $(playerctl --list-all 2>/dev/null); do case $p in kdeconnect*) [ \"$(playerctl -p $p status 2>/dev/null)\" = Playing ] && exec playerctl -p $p next;; esac; done; playerctl --player=kdeconnect,%any next'"

# Settings, top to bottom: whether the widget shows at all, then what it shows
# (art, text), then how it behaves, then fine sizing under "advanced". Mirrors
# the builtin media widget's knobs with this setup's preferred defaults.

[[widget.setting]]
key = "hide_when_no_media"
type = "bool"
label_key = "settings.hide_when_no_media.label"
description_key = "settings.hide_when_no_media.description"
default = true

[[widget.setting]]
key = "hide_album_art"
type = "bool"
label_key = "settings.hide_album_art.label"
description_key = "settings.hide_album_art.description"
default = false

[[widget.setting]]
key = "album_art_only"
type = "bool"
label_key = "settings.album_art_only.label"
description_key = "settings.album_art_only.description"
default = false
visible_when = { key = "hide_album_art", values = ["false"] }

[[widget.setting]]
key = "hide_artist"
type = "bool"
label_key = "settings.hide_artist.label"
description_key = "settings.hide_artist.description"
default = true
visible_when = { key = "album_art_only", values = ["false"] }

[[widget.setting]]
key = "artist_first"
type = "bool"
label_key = "settings.artist_first.label"
description_key = "settings.artist_first.description"
default = false
advanced = true
visible_when = { key = "hide_artist", values = ["false"] }

[[widget.setting]]
key = "title_scroll"
type = "select"
label_key = "settings.title_scroll.label"
description_key = "settings.title_scroll.description"
default = "on_hover"
options = [
  { value = "none", label_key = "settings.title_scroll.none" },
  { value = "always", label_key = "settings.title_scroll.always" },
  { value = "on_hover", label_key = "settings.title_scroll.on_hover" },
]
visible_when = { key = "album_art_only", values = ["false"] }

[[widget.setting]]
key = "show_progress"
type = "bool"
label_key = "settings.show_progress.label"
description_key = "settings.show_progress.description"
default = false

[[widget.setting]]
key = "progress_above"
type = "bool"
label_key = "settings.progress_above.label"
description_key = "settings.progress_above.description"
default = false
visible_when = { key = "show_progress", values = ["true"] }

[[widget.setting]]
key = "art_size"
type = "int"
label_key = "settings.art_size.label"
description_key = "settings.art_size.description"
default = 16
min = 8
max = 96
step = 1
advanced = true
visible_when = { key = "hide_album_art", values = ["false"] }

[[widget.setting]]
key = "art_radius"
type = "int"
label_key = "settings.art_radius.label"
description_key = "settings.art_radius.description"
default = 999
min = 0
max = 999
step = 1
advanced = true
visible_when = { key = "hide_album_art", values = ["false"] }

[[widget.setting]]
key = "max_length"
type = "int"
label_key = "settings.max_length.label"
description_key = "settings.max_length.description"
default = 300
min = 40
max = 800
step = 1
advanced = true
visible_when = { key = "album_art_only", values = ["false"] }

# Now-playing popup, opened by clicking the bar widget. Replaces
# noctalia's builtin control-center media tab: same now-playing card and
# transport controls, minus the PipeWire spectrum visualizer, which stays
# blank for a KDE Connect player (the phone's audio never touches this
# machine's PipeWire graph) and isn't reproducible from the plugin API
# anyway. Open it manually with: noctalia msg panel-toggle jeremiah/phone-media:panel
[[panel]]
id = "panel"
entry = "panel.luau"
width = 340
height = 520
placement = "attached"
position = "auto"
open_near_click = true

# Settings follow the card top to bottom: album art, then track text, then the
# progress bar, then the transport controls, then the lyrics section, then the
# player switcher. Sizing knobs sit under "advanced".

[[panel.setting]]
key = "show_album_art"
type = "bool"
label_key = "settings.panel_show_album_art.label"
description_key = "settings.panel_show_album_art.description"
default = true

[[panel.setting]]
key = "album_art_size"
type = "int"
label_key = "settings.panel_album_art_size.label"
description_key = "settings.panel_album_art_size.description"
default = 160
min = 64
max = 320
step = 4
advanced = true
visible_when = { key = "show_album_art", values = ["true"] }

[[panel.setting]]
key = "album_art_radius"
type = "int"
label_key = "settings.panel_album_art_radius.label"
description_key = "settings.panel_album_art_radius.description"
default = 16
min = 0
max = 999
step = 1
advanced = true
visible_when = { key = "show_album_art", values = ["true"] }

[[panel.setting]]
key = "hide_artist"
type = "bool"
label_key = "settings.hide_artist.label"
description_key = "settings.hide_artist.description"
default = false

[[panel.setting]]
key = "show_album"
type = "bool"
label_key = "settings.panel_show_album.label"
description_key = "settings.panel_show_album.description"
default = true

[[panel.setting]]
key = "show_source_label"
type = "bool"
label_key = "settings.panel_show_source_label.label"
description_key = "settings.panel_show_source_label.description"
default = true

[[panel.setting]]
key = "show_progress"
type = "bool"
label_key = "settings.panel_show_progress.label"
description_key = "settings.panel_show_progress.description"
default = true

[[panel.setting]]
key = "show_time_labels"
type = "bool"
label_key = "settings.panel_show_time_labels.label"
description_key = "settings.panel_show_time_labels.description"
default = true
visible_when = { key = "show_progress", values = ["true"] }

[[panel.setting]]
key = "show_playback_controls"
type = "bool"
label_key = "settings.panel_show_playback_controls.label"
description_key = "settings.panel_show_playback_controls.description"
default = true

[[panel.setting]]
key = "show_lyrics"
type = "bool"
label_key = "settings.panel_show_lyrics.label"
description_key = "settings.panel_show_lyrics.description"
default = true

[[panel.setting]]
key = "lyrics_context_lines"
type = "int"
label_key = "settings.panel_lyrics_context_lines.label"
description_key = "settings.panel_lyrics_context_lines.description"
default = 1
min = 0
max = 4
step = 1
visible_when = { key = "show_lyrics", values = ["true"] }

[[panel.setting]]
key = "show_full_lyrics_button"
type = "bool"
label_key = "settings.panel_show_full_lyrics_button.label"
description_key = "settings.panel_show_full_lyrics_button.description"
default = true
visible_when = { key = "show_lyrics", values = ["true"] }

[[panel.setting]]
key = "show_player_switcher"
type = "bool"
label_key = "settings.panel_show_player_switcher.label"
description_key = "settings.panel_show_player_switcher.description"
default = true

# Standalone lyrics bar widget: a small "open the lyrics popup" icon,
# independent of the "bar" widget above, previewing the current synced line.
# Open its popup manually with: noctalia msg panel-toggle jeremiah/phone-media:lyrics
[[widget]]
id = "lyrics_bar"
entry = "lyrics_bar.luau"

[widget.actions]
left = "panel-toggle jeremiah/phone-media:lyrics"

[[widget.setting]]
key = "hide_when_no_lyrics"
type = "bool"
label_key = "settings.lyrics_bar_hide_when_no_lyrics.label"
description_key = "settings.lyrics_bar_hide_when_no_lyrics.description"
default = true

[[widget.setting]]
key = "show_current_line"
type = "bool"
label_key = "settings.lyrics_bar_show_current_line.label"
description_key = "settings.lyrics_bar_show_current_line.description"
default = true

[[widget.setting]]
key = "max_length"
type = "int"
label_key = "settings.lyrics_bar_max_length.label"
description_key = "settings.lyrics_bar_max_length.description"
default = 220
min = 40
max = 600
step = 1
advanced = true
visible_when = { key = "show_current_line", values = ["true"] }

# Standalone full-size synced-lyrics popup: every line, scrollable, with the
# current one highlighted.
[[panel]]
id = "lyrics"
entry = "lyrics_panel.luau"
width = 420
height = 480
placement = "attached"
position = "auto"
open_near_click = true

[[panel.setting]]
key = "show_track_info"
type = "bool"
label_key = "settings.lyrics_panel_show_track_info.label"
description_key = "settings.lyrics_panel_show_track_info.description"
default = true

[[panel.setting]]
key = "text_align"
type = "select"
label_key = "settings.lyrics_panel_text_align.label"
description_key = "settings.lyrics_panel_text_align.description"
default = "center"
options = [
  { value = "center", label_key = "settings.lyrics_panel_text_align.center" },
  { value = "left", label_key = "settings.lyrics_panel_text_align.left" },
]
